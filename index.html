<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="VoiceCart — a privacy-first, voice-first shopping list with smart suggestions." />
  <title>VoiceCart · Voice Shopping Assistant</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- error banner (only populated if a required module fails to load) -->
  <div id="errorBox" class="error-box" hidden></div>

  <!-- language menu -->
  <header class="topbar">
    <h1 class="brand">🛒 VoiceCart</h1>
    <div class="lang-wrap">
      <button id="langLabel" class="lang-open" aria-haspopup="true">Voice: English ▾</button>
      <div id="langMenu" class="lang-menu hidden">
        <button data-lang="en">English</button>
        <button data-lang="es">Español</button>
        <button data-lang="fr">Français</button>
        <button data-lang="hi">हिंदी</button>
      </div>
    </div>
  </header>

  <!-- listening HUD: shown over the list while recording -->
  <section id="listenHud" class="listen-hud hidden">
    <div class="bars" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p id="listenStatus">Listening…</p>
    <p id="interim" class="interim"></p>
  </section>

  <!-- primary voice toggle -->
  <button id="voiceToggle" class="mic" aria-label="Start listening">
    <span class="mic-ico">🎤</span>
  </button>
  <p id="lastRecognized" class="last-rec" aria-live="polite"></p>

  <main class="layout">
    <!-- suggestions -->
    <section class="panel">
      <div class="panel-head">
        <h2>💡 Smart suggestions</h2>
        <button id="voiceOnlyBtn" class="pill" title="Go hands-free">🔊 Voice-only <span class="sw"></span></button>
      </div>
      <div id="suggestions" class="suggestions"></div>
    </section>

    <!-- voice-activated search -->
    <section class="panel">
      <div class="panel-head"><h2>🔍 Voice search</h2></div>
      <div id="searchPanel" class="search-panel">
        <input id="searchBox" placeholder="Try “find toothpaste under 5”…" aria-label="Search products" />
        <div id="searchResults" class="search-results"></div>
      </div>
    </section>

    <!-- shopping list -->
    <section class="panel">
      <div class="panel-head">
        <h2>🛍️ My list <span id="itemCount" class="count-pill"></span></h2>
        <div class="list-actions">
          <button id="clearDone" class="ghost">✓ Done</button>
          <button id="clearAll" class="ghost danger">Clear</button>
        </div>
      </div>
      <div id="listContainer" class="list"></div>
    </section>
  </main>

  <!-- text input row (fallback + convenience) -->
  <div id="textBox" class="text-box">
    <input id="textInput" placeholder="Type an item… (e.g. “add 2 bottles of water”)" aria-label="Item" />
    <button id="sendBtn" class="send" aria-label="Add">➤</button>
  </div>

  <!-- toasts -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- modules (order matters: data → front → controllers) -->
    <!-- modules (order matters: data → front → controllers) -->
  <script src="js/data.js"></script>
  <script src="js/nlp.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/store.js"></script>
  <script src="js/suggestions.js"></script>
  <script src="js/ml.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA offline support: register the service worker once mid-session.
       Non-fatal — any unsupported browser just skips it. -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          if (window.console && console.error) console.error('[VoiceCart] service worker error', err);
        });
      });
    })();
  </script>
</body>
</html>
