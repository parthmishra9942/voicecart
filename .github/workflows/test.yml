name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lint deps
        run: npm install --no-save eslint@latest

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test